<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6f9c22">
  <title>Agenda de Laboratórios</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Tag de integração do Manifest -->
  <link rel="manifest" href="/manifest.json">

  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: 'c466bdc7-0640-4489-a2ff-b360e4e3c535',
      });
      await OneSignal.User.setLanguage("pt");
    });
  </script>
</head>
<body>
  <div class="container">
    <h1>Agenda de Laboratórios</h1>
    <div class="header">
      <button id="prev">◀</button>
      <h2 id="month-year"></h2>
      <button id="next">▶</button>
    </div>
    <div class="calendar">
      
      <!-- Modal de Agendamento -->
      <div id="modal" class="modal hidden">
        <div class="modal-content">
          <span id="close-modal" class="close">&times;</span>
          <h3>Agendamento</h3>
          <form id="booking-form">
            <input type="text" id="name" placeholder="Seu nome" required />
            <select id="time" required>
              <option value="">Selecione o horário</option>
            </select>
            <select id="location" required>
              <option value="">Selecione o local</option>
              <option value="Informática">Informática</option>
              <option value="Auditório">Auditório</option>
              <option value="Química">Química</option>
              <option value="Matemática">Matemática</option>
            </select>
            <input type="hidden" id="selected-date" />
            <button type="submit">Salvar</button>
          </form>
        </div>
      </div>

      <div class="weekdays">
        <div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div>
      </div>
      <div class="days" id="days"></div>
    </div>
  </div>
  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then((reg) => console.log('PWA Service Worker registrado com sucesso! Scope: ', reg.scope))
          .catch((err) => console.error('Falha ao registrar Service Worker: ', err));
      });
    }
  </script>
</body>
</html>
