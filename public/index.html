<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Endereço - Agendamentos</title>
    <!-- Redireciona automaticamente após 5 segundos -->
    <meta http-equiv="refresh" content="5;url=https://laboratorios-coc.onrender.com/">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 100%;
            border: 1px solid #e2e8f0;
        }
        h1 {
            color: #6f9c22;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        a.btn {
            display: inline-block;
            background-color: #6f9c22;
            color: #ffffff;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.2s;
        }
        a.btn:hover {
            background-color: #55791a;
        }
        .countdown {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Nosso site mudou de endereço!</h1>
        <p>A página de agendamentos foi transferida para um novo servidor oficial. Você será redirecionado automaticamente em instantes.</p>
        
        <a href="https://laboratorios-coc.onrender.com/" class="btn">Acessar Novo Site Agora</a>
        
        <div class="countdown">Se não for redirecionado, clique no botão acima.</div>
    </div>
</body>
</html>
